excluded:
  - .build
  - dist
  - .hermes
  - pipeline

# Legacy thresholds reflect current file sizes so adoption doesn't force a
# mass reformat. Tighten these as CanaryTranscriberLib is decomposed further.
line_length:
  warning: 160
  error: 400
  ignores_urls: true
  ignores_comments: true

file_length:
  warning: 1000
  error: 2000

function_body_length:
  warning: 100
  error: 700

type_body_length:
  warning: 350
  error: 1500

identifier_name:
  min_length:
    warning: 3
    error: 1
